<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT Desk</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8fafc;color:#1f2937}
.header{background:linear-gradient(135deg,#2563eb,#1e3a8a);color:#fff;padding:14px 20px}
.header h1{font-size:18px}.header p{font-size:11px;opacity:.8;margin-top:2px}
.tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid #e5e7eb;padding:0 12px}
.tab{padding:8px 16px;border:none;background:none;cursor:pointer;font-size:12px;color:#6b7280;border-bottom:2px solid transparent}
.tab.active{color:#2563eb;border-bottom-color:#2563eb;font-weight:600}
.upload-area{padding:16px 20px}
.upload-label{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#2563eb;color:#fff;border-radius:6px;cursor:pointer;font-size:13px}
.upload-label:hover{background:#1d4ed8}
.upload-label input{display:none}
.status{padding:4px 20px;font-size:11px;color:#6b7280}
.cards{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 12px}
.card{flex:1;min-width:90px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;text-align:center}
.card .cl{font-size:9px;color:#6b7280}.card .cv{font-size:15px;font-weight:700}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}
.charts img{width:100%;display:block;border-radius:6px}
.charts .wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:10px;margin:8px 0}
th{background:#f1f5f9;padding:5px 7px;text-align:left;font-weight:600;border-bottom:2px solid #2563eb;position:sticky;top:0}
td{padding:4px 7px;border-bottom:1px solid #e5e7eb}
.win{color:#10b981}.loss{color:#ef4444}
.compare-table td,.compare-table th{text-align:center;padding:6px 10px}
.section{padding:0 20px 16px}
h3{font-size:13px;color:#2563eb;margin:8px 0 6px}
@media(max-width:768px){.charts{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body>

<div class="header">
  <h1>📊 MT Desk — MT4/MT5 Trading Analytics</h1>
  <p>Python backend · server-side charts · browser only displays</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('single')">📈 单账户分析</button>
  <button class="tab" onclick="switchTab('compare')">👥 多账户对比</button>
</div>

<!-- SINGLE TAB -->
<div id="tab-single">
  <div class="upload-area">
    <label class="upload-label">📂 选择文件 (.htm/.html)
      <input type="file" accept=".htm,.html" onchange="uploadFile(this)">
    </label>
  </div>
  <div class="status" id="status">拖放文件或点击上传</div>
  <div id="single-content"></div>
</div>

<!-- COMPARE TAB -->
<div id="tab-compare" style="display:none">
  <div class="upload-area">
    <label class="upload-label">📂 添加对比账户 (.htm/.html)
      <input type="file" accept=".htm,.html" onchange="uploadCompare(this)">
    </label>
    <button onclick="clearAccounts()" style="margin-left:8px;padding:6px 12px;border:1px solid #e5e7eb;border-radius:4px;background:#fff;cursor:pointer;font-size:11px">🔄 清除</button>
  </div>
  <div class="status" id="compare-status">已加载 0 个账户</div>
  <div id="compare-content"></div>
</div>

<script>
let loadedAccounts = [];
let currentAcc = null;

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-single').style.display = tab==='single'?'block':'none';
  document.getElementById('tab-compare').style.display = tab==='compare'?'block':'none';
  document.querySelectorAll('.tab')[tab==='single'?0:1].classList.add('active');
  if(tab==='compare'&&loadedAccounts.length>=2) renderCompare();
}

async function uploadFile(input) {
  const f = input.files[0]; if(!f) return;
  document.getElementById('status').textContent = '⏳ 解析中...';
  const fd = new FormData(); fd.append('file', f);
  try {
    const r = await fetch('/api/parse', {method:'POST', body:fd});
    const d = await r.json();
    if(d.error) { document.getElementById('status').textContent = '❌ '+d.error; return; }
    loadedAccounts = loadedAccounts.filter(a => a.account!==d.account);
    loadedAccounts.push(d);
    currentAcc = d;
    renderSingle(d);
    document.getElementById('status').textContent = '✅ '+f.name+' — '+d.count+'笔 · P/L: $'+d.stats.total_pl.toFixed(2)+' · 胜率: '+d.stats.wr.toFixed(0)+'%';
  } catch(e) { document.getElementById('status').textContent = '❌ '+e.message; }
  input.value = '';
}

function renderSingle(d) {
  const s = d.stats;
  const cards = [
    ['总交易', s.count], ['总盈亏', '$'+s.total_pl.toFixed(2), s.total_pl>=0?'#10b981':'#ef4444'],
    ['胜率', s.wr.toFixed(0)+'%', '#10b981'], ['盈利因子', s.pf===Infinity?'∞':s.pf.toFixed(2)],
    ['最大回撤', '$'+s.max_dd.toFixed(2), '#ef4444'], ['夏普', s.sharpe.toFixed(2)],
    ['均盈', '+$'+s.avg_win.toFixed(2), '#10b981'], ['均亏', '-$'+Math.abs(s.avg_loss).toFixed(2), '#ef4444'],
    ['最佳', '+$'+s.best.toFixed(2), '#10b981'], ['最差', '-$'+Math.abs(s.worst).toFixed(2), '#ef4444'],
    ['连续盈利', s.max_win_streak+'笔'], ['连续亏损', s.max_loss_streak+'笔']
  ];
  let h = '<div class="cards">'+cards.map(([l,v,c])=>`<div class="card"><div class="cl">${l}</div><div class="cv" style="color:${c||'#1f2937'}">${v}</div></div>`).join('')+'</div>';
  h += '<div class="charts">';
  if(d.charts.equity) h += '<div class="wide"><img src="data:image/png;base64,'+d.charts.equity+'"></div>';
  if(d.charts.symbol) h += '<div><img src="data:image/png;base64,'+d.charts.symbol+'"></div>';
  if(d.charts.winloss) h += '<div><img src="data:image/png;base64,'+d.charts.winloss+'"></div>';
  if(d.charts.monthly) h += '<div class="wide"><img src="data:image/png;base64,'+d.charts.monthly+'"></div>';
  if(d.charts.streaks) h += '<div><img src="data:image/png;base64,'+d.charts.streaks+'"></div>';
  if(d.charts.hourly) h += '<div><img src="data:image/png;base64,'+d.charts.hourly+'"></div>';
  h += '</div>';
  if(d.trades) {
    h += '<h3 class="section">📋 逐笔明细</h3><div style="max-height:360px;overflow:auto;margin:0 20px"><table><thead><tr><th>Ticket</th><th>开仓</th><th>方向</th><th>手数</th><th>品种</th><th>平仓</th><th>盈亏</th></tr></thead><tbody>';
    d.trades.forEach(t => {
      h += `<tr class="${t.profit>0?'win':'loss'}"><td>${t.ticket}</td><td>${t.open}</td><td>${t.type.toUpperCase()}</td><td>${t.volume}</td><td>${t.symbol.toUpperCase()}</td><td>${t.close}</td><td>$${t.profit.toFixed(2)}</td></tr>`;
    });
    h += '</tbody></table></div>';
  }
  document.getElementById('single-content').innerHTML = h;
}

async function uploadCompare(input) {
  await uploadFile(input);
  document.getElementById('compare-status').textContent = '已加载 '+loadedAccounts.length+' 个账户';
  if(loadedAccounts.length >= 2) renderCompare();
  input.value = '';
}

async function renderCompare() {
  try {
    const r = await fetch('/api/compare');
    const d = await r.json();
    if(d.error) return;
    let h = '<div class="charts">';
    if(d.charts.equity) h += '<div class="wide"><img src="data:image/png;base64,'+d.charts.equity+'"></div>';
    if(d.charts.monthly) h += '<div class="wide"><img src="data:image/png;base64,'+d.charts.monthly+'"></div>';
    h += '</div>';

    // Stats table
    const headers = ['指标', ...d.accounts.map(a => a.account)];
    const rows = [
      ['笔数', ...d.accounts.map(a => a.stats.count)],
      ['总盈亏', ...d.accounts.map(a => '$'+a.stats.total_pl.toFixed(2))],
      ['胜率', ...d.accounts.map(a => a.stats.wr.toFixed(0)+'%')],
      ['最大回撤', ...d.accounts.map(a => '$'+a.stats.max_dd.toFixed(2))],
      ['夏普', ...d.accounts.map(a => a.stats.sharpe.toFixed(2))],
      ['连续盈利', ...d.accounts.map(a => a.stats.max_win_streak)],
      ['连续亏损', ...d.accounts.map(a => a.stats.max_loss_streak)],
    ];
    h += '<h3 class="section">📊 统计对比</h3><table class="compare-table"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>';
    rows.forEach(row => { h += '<tr>'+row.map((v,i)=>'<td'+(i>0?' style="font-weight:600"':'')+'>'+v+'</td>').join('')+'</tr>'; });
    h += '</tbody></table>';
    document.getElementById('compare-content').innerHTML = h;
  } catch(e) {}
}

function clearAccounts() { loadedAccounts = []; document.getElementById('compare-content').innerHTML = ''; document.getElementById('compare-status').textContent = '已加载 0 个账户'; }
</script></body></html>
