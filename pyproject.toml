[project]
name = "mt-desk"
version = "6.2.2"
description = "MT4/MT5 Trading Analytics Desktop — CSV import + R-Multiple analysis (ported from trading-record-analysis)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "saileri" }]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[project.scripts]
mt-desk = "mt_desk.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pyinstaller]
name = "MT Desk"
onefile = true
noconsole = true
icon = "assets/icon.ico"
add_data = [
    "mt_desk/config/*:mt_desk/config/",
]
hidden_imports = [
    "tkinter",
    "tkinter.filedialog",
    "tkinter.messagebox",
    "mt_desk",
    "mt_desk.parser",
    "mt_desk.analysis",
    "mt_desk.csv_import",
    "mt_desk.field_mapper",
    "yaml",
]
