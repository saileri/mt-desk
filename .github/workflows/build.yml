name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml
          pip install pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --onefile --noconsole `
            --name "MT_Desk" `
            --add-data "mt_desk/config/mt_column_map.yaml;mt_desk/config/" `
            --add-data "mt_desk/config/app_config.yaml;mt_desk/config/" `
            --hidden-import tkinter `
            --hidden-import tkinter.filedialog `
            --hidden-import tkinter.messagebox `
            --hidden-import mt_desk `
            --hidden-import mt_desk.parser `
            --hidden-import mt_desk.analysis `
            --hidden-import mt_desk.csv_import `
            --hidden-import yaml `
            mt_desk/main.py

      - name: Verify EXE exists
        run: |
          if (Test-Path "dist/MT_Desk.exe") {
            Write-Host "EXE built successfully: $((Get-Item 'dist/MT_Desk.exe').Length) bytes"
          } else {
            Write-Error "dist/MT_Desk.exe not found!"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT_Desk
          path: dist/MT_Desk.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MT_Desk.exe
          generate_release_notes: true
